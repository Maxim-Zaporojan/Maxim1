<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy 10th Anniversary Moo ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            font-family: Georgia, serif;

            /* YOUR BACKGROUND IMAGE */
            background-image:
                linear-gradient(
                    rgba(255, 80, 130, 0.35),
                    rgba(120, 20, 70, 0.45)
                ),
                url("90375168-d3c7-4df7-af00-4bf96c88fa60.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dark/light glow over background */

        .background-glow {
            position: absolute;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.12);

            filter: blur(100px);

            animation: glow 4s infinite alternate;

            pointer-events: none;
        }

        @keyframes glow {

            from {
                transform: scale(0.8);
                opacity: 0.4;
            }

            to {
                transform: scale(1.2);
                opacity: 0.8;
            }

        }

        /* Main area */

        .container {
            position: relative;
            z-index: 2;

            text-align: center;
        }

        /* Instruction */

        .instruction {
            color: white;

            font-size: 22px;

            margin-bottom: 45px;

            letter-spacing: 2px;

            text-shadow:
                0 0 10px rgba(0,0,0,0.5);

            animation: fadeIn 2s ease;
        }

        /* HEART */

        .heart {

            width: 180px;
            height: 180px;

            position: relative;

            margin: auto;

            cursor: pointer;

            transform: rotate(-45deg);

            background: #e91e63;

            box-shadow:
                0 0 30px rgba(255,255,255,0.7),
                0 0 80px rgba(255,20,100,0.8);

            animation: heartbeat 1.5s infinite;

            transition: 0.5s ease;
        }

        .heart::before,
        .heart::after {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: #e91e63;
        }

        .heart::before {

            top: -90px;
            left: 0;
        }

        .heart::after {

            left: 90px;
            top: 0;
        }

        /* Heart beating */

        @keyframes heartbeat {

            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }

            50% {
                transform: rotate(-45deg) scale(1.08);
            }

        }

        /* Heart opens */

        .heart.open {

            animation: heartOpen 1s forwards;

        }

        @keyframes heartOpen {

            0% {

                transform:
                    rotate(-45deg)
                    scale(1);

                opacity: 1;
            }

            100% {

                transform:
                    rotate(-45deg)
                    scale(4);

                opacity: 0;
            }

        }

        /* MESSAGE */

        .message {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0);

            width: 90%;

            max-width: 1000px;

            color: white;

            text-align: center;

            opacity: 0;

            transition:
                all 1.5s ease;

            z-index: 5;

        }

        .message.show {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;

        }

        .message h1 {

            font-size:
                clamp(40px, 7vw, 90px);

            margin-bottom: 25px;

            text-shadow:

                0 0 10px rgba(0,0,0,0.8),

                0 0 25px rgba(255,255,255,0.8),

                0 0 50px rgba(255,100,150,0.8);

        }

        .message p {

            font-size:
                clamp(20px, 3vw, 32px);

            letter-spacing: 2px;

            text-shadow:
                0 0 10px rgba(0,0,0,0.8);

        }

        .heart-small {

            font-size: 50px;

            margin-top: 30px;

            animation:
                float 2s infinite ease-in-out;

        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 0.9;

                transform:
                    translateY(0);
            }

        }

        /* FLOATING HEARTS */

        .floating-heart {

            position: absolute;

            bottom: -50px;

            color: rgba(255,255,255,0.8);

            font-size: 25px;

            animation:
                rise linear forwards;

            pointer-events: none;

            z-index: 10;
        }

        @keyframes rise {

            from {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            to {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }

    </style>

</head>

<body>

    <div class="background-glow"></div>

    <div class="container">

        <div class="instruction" id="instruction">
            Click the heart ❤️
        </div>

        <div class="heart" id="heart"></div>

    </div>


    <!-- ANNIVERSARY MESSAGE -->

    <div class="message" id="message">

        <h1>
            Happy 10th Anniversary Moo ❤️
        </h1>

        <p>
            Ten months of memories, laughter and love.
        </p>

        <div class="heart-small">
            ❤️ ✨ ❤️
        </div>

    </div>


    <script>

        const heart =
            document.getElementById("heart");

        const message =
            document.getElementById("message");

        const instruction =
            document.getElementById("instruction");

        let opened = false;


        heart.addEventListener("click", function() {

            if (opened) return;

            opened = true;


            /* Hide instruction */

            instruction.style.opacity = "0";


            /* Open heart */

            heart.classList.add("open");


            /* Show message */

            setTimeout(() => {

                message.classList.add("show");

            }, 700);


            /* Create floating hearts */

            for (let i = 0; i < 30; i++) {

                setTimeout(() => {

                    const floatingHeart =
                        document.createElement("div");

                    floatingHeart.classList.add(
                        "floating-heart"
                    );

                    floatingHeart.innerHTML = "❤️";


                    floatingHeart.style.left =
                        Math.random() * 100 + "vw";


                    floatingHeart.style.fontSize =
                        (15 + Math.random() * 35) + "px";


                    floatingHeart.style.animationDuration =
                        (4 + Math.random() * 5) + "s";


                    document.body.appendChild(
                        floatingHeart
                    );


                    setTimeout(() => {

                        floatingHeart.remove();

                    }, 9000);

                }, i * 100);

            }

        });

    </script>

</body>
</html>
